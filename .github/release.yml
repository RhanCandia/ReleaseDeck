changelog:
  exclude:
    labels:
      - "ignore-for-release"
    authors:
      - "*"
  categories:
    - title: "Features and Improvements"
      labels:
        - "feat"
        - "enhancement"
    - title: "Bug Fixes"
      labels:
        - "fix"
        - "bug"
    - title: "Documentation"
      labels:
        - "docs"
    - title: "Maintenance and Dependencies"
      labels:
        - "chore"
        - "ci"
        - "dependencies"
